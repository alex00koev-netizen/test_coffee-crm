<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест принтера</title>
<style>
  :root{
    --paper:#F1F0EB;
    --ink:#16160F;
    --ink-soft:#6B6A60;
    --rule:#C9C7BC;
    --ok:#2C6E49;
    --bad:#A32C1E;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:0;
    background:#3A3A38;
    color:var(--ink);
    font:16px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
    display:flex;justify-content:center;
    min-height:100dvh;
  }
  .tape{
    width:100%;max-width:420px;
    background:var(--paper);
    padding:0 22px 40px;
    position:relative;
    box-shadow:0 0 32px rgba(0,0,0,.45);
  }
  /* Оторванный край сверху и снизу — страница как лента чека */
  .tape::before,.tape::after{
    content:"";position:absolute;left:0;right:0;height:10px;
    background:
      conic-gradient(from 135deg at 50% 0, var(--paper) 0 90deg, transparent 0) 0 0/16px 10px repeat-x;
  }
  .tape::before{top:0;transform:translateY(-9px)}
  .tape::after{bottom:0;transform:translateY(9px) rotate(180deg)}

  h1{
    font-size:19px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    margin:34px 0 4px;text-align:center;
  }
  .sub{
    text-align:center;color:var(--ink-soft);font-size:13px;margin:0 0 22px;
  }
  hr{border:0;border-top:1px dashed var(--rule);margin:20px 0}

  ol{margin:0;padding-left:1.4em}
  li{margin-bottom:10px}
  li b{font-weight:700}

  button{
    font:inherit;font-weight:700;
    width:100%;border:none;border-radius:2px;
    background:var(--ink);color:var(--paper);
    padding:20px 16px;margin-top:6px;
    letter-spacing:.06em;text-transform:uppercase;
    cursor:pointer;
  }
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.45}
  button:focus-visible{outline:3px solid var(--ok);outline-offset:3px}

  #log{margin-top:22px;min-height:24px;font-size:14px}
  #log div{
    padding:3px 0;
    animation:feed .25s ease-out;
  }
  #log .ok{color:var(--ok);font-weight:700}
  #log .bad{color:var(--bad);font-weight:700}
  @keyframes feed{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){#log div{animation:none}}

  details{margin-top:28px;color:var(--ink-soft);font-size:14px}
  summary{cursor:pointer;padding:6px 0}
  .row{display:flex;gap:10px;margin-top:10px}
  .row input,.row select{
    font:inherit;padding:12px;border:1px solid var(--rule);
    border-radius:2px;background:#fff;color:var(--ink);width:100%;
  }
  details button{background:none;color:var(--ink);border:1px solid var(--ink);padding:14px}
</style>
</head>
<body>
<div class="tape">

  <h1>Тест принтера</h1>
  <p class="sub">MEGA UG COFFEE</p>
  <hr>

  <ol>
    <li>Включите принтер, заправьте бумагу</li>
    <li>Нажмите большую кнопку внизу</li>
    <li>Выберите принтер в списке Bluetooth</li>
    <li>Дождитесь, пока распечатается лента</li>
    <li><b>Сфотографируйте всю ленту</b> и отправьте администратору</li>
  </ol>

  <button id="go">Напечатать тест</button>

  <div id="log"></div>

  <details>
    <summary>Проверить один вариант (для администратора)</summary>
    <div class="row">
      <input id="cp" type="number" inputmode="numeric" placeholder="Номер, напр. 17">
      <select id="enc">
        <option value="cp1251">CP1251</option>
        <option value="cp866">CP866</option>
      </select>
    </div>
    <button id="go2">Печать образца</button>
  </details>

</div>

<script>
const SERVICE_UUID = '000018f0-0000-1000-8000-00805f9b34fb';
const CHAR_UUID    = '00002af1-0000-1000-8000-00805f9b34fb';
const SAMPLE       = 'Кава Тест іїєґ АБВ абв';
const CANDIDATES   = [6, 7, 15, 16, 17, 33, 46, 47, 72, 73];

let _char = null;

function log(msg, cls){
  const el = document.createElement('div');
  if (cls) el.className = cls;
  el.textContent = msg;
  document.getElementById('log').appendChild(el);
}

function cp1251(str){
  const b=[];
  for(let i=0;i<str.length;i++){
    const c=str.charCodeAt(i);
    if(c<128){b.push(c);continue}
    if(c===0x0401){b.push(0xA8);continue}
    if(c===0x0451){b.push(0xB8);continue}
    if(c===0x0490){b.push(0xA5);continue}
    if(c===0x0491){b.push(0xB4);continue}
    if(c===0x0404){b.push(0xAA);continue}
    if(c===0x0454){b.push(0xBA);continue}
    if(c===0x0406){b.push(0xB2);continue}
    if(c===0x0456){b.push(0xB3);continue}
    if(c===0x0407){b.push(0xAF);continue}
    if(c===0x0457){b.push(0xBF);continue}
    if(c>=0x0410&&c<=0x044F){b.push(c-0x0410+0xC0);continue}
    b.push(0x3F);
  }
  return b;
}

function cp866(str){
  const b=[];
  for(let i=0;i<str.length;i++){
    const c=str.charCodeAt(i);
    if(c<128){b.push(c);continue}
    if(c===0x0401){b.push(0xF0);continue}
    if(c===0x0451){b.push(0xF1);continue}
    if(c===0x0404){b.push(0xF2);continue}
    if(c===0x0454){b.push(0xF3);continue}
    if(c===0x0407){b.push(0xF4);continue}
    if(c===0x0457){b.push(0xF5);continue}
    if(c===0x0406){b.push(0x49);continue}
    if(c===0x0456){b.push(0x69);continue}
    if(c===0x0490){b.push(0x83);continue}
    if(c===0x0491){b.push(0xA3);continue}
    if(c>=0x0410&&c<=0x042F){b.push(c-0x0410+0x80);continue}
    if(c>=0x0430&&c<=0x043F){b.push(c-0x0430+0xA0);continue}
    if(c>=0x0440&&c<=0x044F){b.push(c-0x0440+0xE0);continue}
    b.push(0x3F);
  }
  return b;
}

async function connect(){
  if(_char) return _char;
  if(!navigator.bluetooth){
    log('Bluetooth недоступен. Откройте страницу в Chrome на Android.','bad');
    return null;
  }
  log('Выберите принтер в списке…');
  const device = await navigator.bluetooth.requestDevice({
    filters:[{services:[SERVICE_UUID]}],
    optionalServices:[SERVICE_UUID]
  });
  const server  = await device.gatt.connect();
  const service = await server.getPrimaryService(SERVICE_UUID);
  _char = await service.getCharacteristic(CHAR_UUID);
  log('Принтер подключён: ' + (device.name || 'без имени'));
  return _char;
}

async function send(bytes){
  const data = new Uint8Array(bytes);
  const CHUNK = 180;
  for(let i=0;i<data.length;i+=CHUNK){
    await _char.writeValue(data.slice(i,i+CHUNK));
    await new Promise(r=>setTimeout(r,40));
  }
}

function buildTest(){
  const b=[];
  const push=a=>a.forEach(x=>b.push(x));
  const ascii=s=>{for(let i=0;i<s.length;i++)b.push(s.charCodeAt(i));b.push(0x0A)};

  push([0x1B,0x40]);
  push([0x1C,0x2E]); // FS . — выход из режима китайских иероглифов (Kanji mode)
  ascii('TEST CODEPAGE v2');
  ascii('MEGA UG');
  ascii('------------------------------');

  // Вариант без команды переключения — вдруг нужная таблица уже стоит в принтере
  ascii('default cp1251:');
  push(cp1251(SAMPLE)); push([0x0A]);
  ascii('default cp866 :');
  push(cp866(SAMPLE));  push([0x0A]);
  ascii('------------------------------');

  CANDIDATES.forEach(n=>{
    push([0x1C,0x2E]); // повторяем на каждом шаге — на случай если ESC t сама включает Kanji обратно
    push([0x1B,0x74,n]);
    ascii('n='+n+' cp1251:');
    push(cp1251(SAMPLE)); push([0x0A]);
    ascii('n='+n+' cp866 :');
    push(cp866(SAMPLE));  push([0x0A]);
    ascii('------------------------------');
  });

  push([0x0A,0x0A,0x0A]);
  return b;
}

document.getElementById('go').onclick = async function(){
  this.disabled = true;
  try{
    if(!await connect()) { this.disabled=false; return; }
    log('Печатаю…');
    await send(buildTest());
    log('Готово. Сфотографируйте ленту целиком.','ok');
  }catch(e){
    log('Не получилось: ' + e.message, 'bad');
  }
  this.disabled = false;
};

document.getElementById('go2').onclick = async function(){
  const n = parseInt(document.getElementById('cp').value,10);
  if(!Number.isFinite(n)){ log('Введите номер таблицы','bad'); return; }
  const enc = document.getElementById('enc').value;
  this.disabled = true;
  try{
    if(!await connect()) { this.disabled=false; return; }
    const b=[]; const push=a=>a.forEach(x=>b.push(x));
    const ascii=s=>{for(let i=0;i<s.length;i++)b.push(s.charCodeAt(i));b.push(0x0A)};
    push([0x1B,0x40]);
    push([0x1B,0x74,n]);
    ascii('n='+n+' '+enc+':');
    push(enc==='cp866'?cp866(SAMPLE):cp1251(SAMPLE)); push([0x0A]);
    ascii("Клiєнт: Волошина");
    push(enc==='cp866'?cp866('Ароматна кава'):cp1251('Ароматна кава')); push([0x0A]);
    push([0x0A,0x0A,0x0A]);
    await send(b);
    log('Образец напечатан: n='+n+' '+enc,'ok');
  }catch(e){
    log('Не получилось: ' + e.message,'bad');
  }
  this.disabled = false;
};
</script>
</body>
</html>
